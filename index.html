<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="refresh" content="1;url=https://wa.me/972542266696?text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A4%D7%A8%D7%98%D7%99%D7%9D%20%D7%9C%D7%92%D7%91%D7%99%20%D7%94%D7%90%D7%A7%D7%93%D7%97%20%D7%90%D7%95%D7%95%D7%99%D7%A8%F0%9F%94%AB">
    
    <title>מעביר אותך לוואצאפ...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
        }
        .loading-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            padding: 16px 32px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            animation: pulse 2s infinite;
        }
        .whatsapp-btn:active {
            background-color: #1DA851;
        }
        /* אנימציית פעימה קטנה לכפתור כדי למשוך תשומת לב במידה והאוטומט נחסם */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* קישור נסתר לטריקים של עקיפת דפדפן */
        #hidden-link { display: none; }
    </style>
</head>
<body>

    <div class="loading-text">מיד תועבר לוואצאפ ⏳</div>
    
    <button class="whatsapp-btn" onclick="openWhatsApp()">אם לא הועברת, לחץ כאן למעבר 💬</button>
    
    <a id="hidden-link" target="_top" href="#"></a>

    <script>
        var phone = "972542266696"; 
        var message = "היי, אשמח לפרטים לגבי האקדח אוויר🔫";
        var encodedMessage = encodeURIComponent(message);

        var waMeUrl = "https://wa.me/" + phone + "?text=" + encodedMessage;
        var appSchemeUrl = "whatsapp://send?phone=" + phone + "&text=" + encodedMessage;
        var intentUrl = "intent://send?phone=" + phone + "&text=" + encodedMessage + "#Intent;scheme=whatsapp;package=com.whatsapp;end";

        // פונקציית המעבר הראשית
        function openWhatsApp() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            var isAndroid = /android/i.test(userAgent);

            if (isAndroid) {
                window.location.replace(intentUrl);
                setTimeout(function() { window.location.replace(waMeUrl); }, 600);
            } else if (isIOS) {
                window.location.replace(appSchemeUrl);
                setTimeout(function() { window.location.replace(waMeUrl); }, 600);
            } else {
                window.location.replace(waMeUrl);
            }
        }

        // רשת ביטחון 2: ניסיון לחיצה מזויפת (Simulated Click) שעוקף webviews
        function fakeClickFallback() {
            var link = document.getElementById('hidden-link');
            link.href = waMeUrl;
            link.click();
        }

        // --- הפעלה אוטומטית בעת טעינת הדף ---
        window.onload = function() {
            // ניסיון ראשון: מיד עם טעינת הדף
            setTimeout(function() {
                openWhatsApp();
            }, 100);

            // ניסיון שני: אם אחרי 1.5 שניות המשתמש עדיין כאן, נפעיל לחיצה מזויפת
            setTimeout(function() {
                fakeClickFallback();
            }, 1500);
        };
    </script>
</body>
</html>
