<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעביר לוואטסאפ...</title>

<script>
const phone = "972542266696";
const message = encodeURIComponent("היי, אשמח לפרטים לגבי אקדח האוויר 🔫");

const links = {
    app: `whatsapp://send?phone=${phone}&text=${message}`,
    web: `https://wa.me/${phone}?text=${message}`,
    api: `https://api.whatsapp.com/send?phone=${phone}&text=${message}`
};

let opened = false;

function tryOpen(url) {
    if (opened) return;
    opened = true;
    window.location.href = url;
}

function detectDevice() {
    const ua = navigator.userAgent;
    return {
        ios: /iPhone|iPad|iPod/i.test(ua),
        android: /Android/i.test(ua)
    };
}

function openAllMethods() {
    // ניסיון 1 - פתיחה ישירה
    tryOpen(links.app);

    // ניסיון 2 - iframe
    setTimeout(() => {
        let iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = links.app;
        document.body.appendChild(iframe);
    }, 400);

    // ניסיון 3 - API רשמי
    setTimeout(() => tryOpen(links.api), 1200);

    // ניסיון 4 - wa.me
    setTimeout(() => tryOpen(links.web), 2000);
}

function smartOpen() {
    const device = detectDevice();

    if (device.ios) {
        tryOpen(links.api);
    } else if (device.android) {
        tryOpen(links.app);
    } else {
        tryOpen(links.web);
    }
}

// ניסיון אוטומטי
window.onload = () => {
    setTimeout(openAllMethods, 300);
};

// לחיצה על המסך (עוקף חסימות טיקטוק)
document.addEventListener("click", smartOpen);

// כפתור ראשי
function openWhatsApp() {
    smartOpen();
}

// כפתור fallback
function openWeb() {
    window.location.href = links.web;
}
</script>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, #020617, #0f172a);
    color: white;
}

h1 {
    font-size: 26px;
    margin-bottom: 10px;
}

p {
    opacity: 0.8;
}

.btn {
    display: block;
    margin: 15px auto;
    padding: 20px;
    font-size: 20px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    width: 90%;
    max-width: 340px;
}

.primary {
    background: #25D366;
    color: white;
    font-weight: bold;
}

.secondary {
    background: #334155;
    color: white;
}

.note {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>

<body>

<h1>💬 מעבר לוואטסאפ</h1>
<p>לחץ על הכפתור למעבר מיידי</p>

<button class="btn primary" onclick="openWhatsApp()">
👉 פתח וואטסאפ עכשיו
</button>

<button class="btn secondary" onclick="openWeb()">
🔁 אם לא עבד - לחץ כאן
</button>

<div class="note">
אם זה לא נפתח:<br>
פתח דרך הדפדפן (⋮ → Open in browser)
</div>

</body>
</html>
