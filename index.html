<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פותח וואצאפ...</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f0f2f5; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        .whatsapp-btn {
            background-color: #25D366; 
            color: white; 
            padding: 20px 40px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 50px; 
            text-decoration: none; 
            text-align: center; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .whatsapp-btn:active {
            background-color: #1DA851;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <a href="#" id="waLink" class="whatsapp-btn" target="_blank">לפרטים בוואצאפ לחץ כאן 💬</a>

    <script>
        // הגדרת המספר וההודעה המקודדת
        var phone = "972542266696";
        var message = encodeURIComponent("היי, אשמח לפרטים לגבי המוצר 🔫");
        
        // יצירת שלושת סוגי הקישורים האפשריים
        // 1. הקישור הרשמי של ה-API (הכי אמין לגיבוי רשת)
        var waMeUrl = "https://api.whatsapp.com/send?phone=" + phone + "&text=" + message;
        // 2. קישור ישיר לאפליקציה באייפון
        var iosUrl = "whatsapp://send?phone=" + phone + "&text=" + message;
        // 3. קישור Intent אגרסיבי לאנדרואיד שעוקף WebViews
        var androidIntent = "intent://send?phone=" + phone + "&text=" + message + "#Intent;scheme=whatsapp;package=com.whatsapp;end";

        // מציאת הכפתור שלנו
        var link = document.getElementById("waLink");

        // זיהוי מכשיר
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        var isAndroid = /android/i.test(userAgent);

        // שלב א': שותלים את הקישור האגרסיבי ביותר ישירות בתוך ה-HTML
        if (isAndroid) {
            link.href = androidIntent;
        } else if (isIOS) {
            link.href = iosUrl;
        } else {
            link.href = waMeUrl;
        }

        // שלב ב': מערכת גיבוי כפולה (Fallback)
        // אם המשתמש לחץ וטיקטוק "בלע" את הפעולה ולא פתח כלום, 
        // הקוד ימתין 800 מילישניות ואז יפעיל העברה כפויה לקישור הרשת
        link.addEventListener('click', function(e) {
            setTimeout(function() {
                window.location.href = waMeUrl;
            }, 800);
        });
    </script>
</body>
</html>
